[package]
name = "kapture"
version = "0.1.0"
description = "Kapture — Wireshark for Kafka events"
authors = ["Stephane Derosiaux"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sderosiaux/kapture"

[lib]
name = "kapture_lib"
# Tauri's runtime needs `cdylib` on iOS/Android and `rlib` for the
# desktop integration that links the same crate from `src/main.rs`.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Updater + process plugins are desktop-only. See target-specific section below.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
bytes = "1"
# Vendored fork at vendor/kafka-protocol-rs (sderosiaux/kafka-protocol-rs
# branch `kapture`). Forked because upstream is sparsely maintained
# and we need newer ApiVersions / Fetch / Metadata schemas + a couple
# of small bug fixes. See `vendor/kafka-protocol-rs/README.md` and the
# kapture-conventions memory note.
kafka-protocol = { path = "../vendor/kafka-protocol-rs", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
pest = "2"
pest_derive = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
apache-avro = "0.21"
lru = "0.18"
dirs = "6"
rmcp = { version = "1.6", features = [
  "server",
  "transport-streamable-http-server",
  "transport-streamable-http-server-session",
  "macros",
  "schemars",
] }
axum = "0.8"
tower = "0.5"
schemars = "1"
subtle = "2"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
base64 = "0.22"
rand = "0.10"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3"
rcgen = "0.13"

[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Tauri commands receive State / AppHandle by value, by design.
needless_pass_by_value = "allow"
# Throughput display: u64 -> f64 is intentional.
cast_precision_loss = "allow"
# Sometimes a match arm is clearer than map_or_else.
option_if_let_else = "allow"
# Common across this codebase.
module_name_repetitions = "allow"
similar_names = "allow"

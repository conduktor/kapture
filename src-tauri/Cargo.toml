[package]
name = "kapture"
version = "0.1.0"
description = "Kapture — Wireshark for Kafka events"
authors = ["Stephane Derosiaux"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sderosiaux/kapture"

[lib]
name = "kapture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Updater + process plugins are desktop-only. See target-specific section below.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdkafka = { version = "0.36", default-features = false, features = ["tokio", "dynamic-linking", "libz"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
bytes = "1"
kafka-protocol = "0.16"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
pest = "2"
pest_derive = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
apache-avro = "0.17"
lru = "0.12"
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
dirs = "5"
rmcp = { version = "1.6", features = [
  "server",
  "transport-streamable-http-server",
  "transport-streamable-http-server-session",
  "macros",
  "schemars",
] }
axum = "0.8"
tower = "0.5"
schemars = "1"
subtle = "2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
# Forbid is too strong: the proto_hook module wraps a C FFI from our
# patched librdkafka and needs `unsafe`. We deny by default and that
# module locally allows it with #![allow(unsafe_code)].
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Tauri commands receive State / AppHandle by value, by design.
needless_pass_by_value = "allow"
# Throughput display: u64 -> f64 is intentional.
cast_precision_loss = "allow"
# Sometimes a match arm is clearer than map_or_else.
option_if_let_else = "allow"
# Common across this codebase.
module_name_repetitions = "allow"
similar_names = "allow"

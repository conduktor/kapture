name: CI

# Runs on every push and PR. Mirrors the local `pnpm check` umbrella:
# typecheck + eslint + prettier + vitest + cargo fmt + cargo clippy + cargo test.
# Splits frontend and Rust into parallel jobs so a clippy warning doesn't
# wait on a typecheck failure (and vice-versa).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck + lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (with submodules)
        # The kafka-protocol-rs fork lives at vendor/kafka-protocol-rs and
        # is referenced via `path = "../vendor/..."` in src-tauri/Cargo.toml.
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tauri system deps (cached)
        # Tauri on Linux pulls webkit2gtk + glib + librsvg for the
        # build. cargo check / clippy / test compile the tauri crate
        # which links against them.
        # The cached-action snapshots /var/cache/apt + the installed
        # files on first run; later runs skip the 30+ s download. Bump
        # `version:` to bust the cache deliberately when the package
        # set changes.
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          version: "1"

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

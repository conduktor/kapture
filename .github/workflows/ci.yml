name: CI

# Runs on every push and PR. Mirrors the local `pnpm check` umbrella:
# typecheck + eslint + prettier + vitest + cargo fmt + cargo clippy + cargo test.
# Splits frontend and Rust into parallel jobs so a clippy warning doesn't
# wait on a typecheck failure (and vice-versa).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck + lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (with submodules)
        # The kafka-protocol-rs fork lives at vendor/kafka-protocol-rs and
        # is referenced via `path = "../vendor/..."` in src-tauri/Cargo.toml.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Save the cargo registry + target/ even when the job fails
          # (clippy / fmt / test errors). Without this, a red run never
          # writes the cache, so the *next* green run still has to
          # re-download every crate. With it, a clippy fix on top of a
          # red main hits the warm cache.
          cache-on-failure: true

      - name: Tauri system deps (cached)
        # Tauri on Linux pulls webkit2gtk + glib + librsvg for the
        # build. cargo check / clippy / test compile the tauri crate
        # which links against them.
        # The cached-action snapshots /var/cache/apt + the installed
        # files on first run; later runs skip the 30+ s download. Bump
        # `version:` to bust the cache deliberately when the package
        # set changes.
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          version: "1"

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

  windows-check:
    name: Windows (cargo check)
    runs-on: windows-latest
    timeout-minutes: 30
    # Linux/macOS build the app in release.yml; Windows only got built at
    # tag time, so a Windows-only compile break (e.g. Unix-domain-socket
    # code) slipped to release. This cheap `cargo check` catches that on
    # every push/PR. JVM tap mode is cfg(unix); on Windows the tap
    # commands are stubbed, so the lib + bins must still compile.
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: cargo check (lib + bins)
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-features

  anti-patterns-integration:
    name: Anti-patterns integration (7/7 real brokers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The 7 detectors need different broker shapes:
    #  - overcommit / producer-per-record / tiny-batches / rebalance-loop
    #    → any single broker (we use the kafka:latest from the `kafka` profile)
    #  - stale-leader-producing → 3-broker KRaft cluster (`mb` profile, ports 39092/93/94)
    #    so RF=2 spreads leadership and we can target a non-leader.
    #  - mixed-api-version → two brokers of different Kafka versions
    #    (`kafka` profile latest + `legacy` profile 3.7.0).
    #  - sasl-session-too-short → SASL_PLAINTEXT broker (`sasl` profile, port 49092)
    #    so a wrong-password SaslAuthenticate produces error_code=58.
    # We bring up all profiles via docker compose rather than GHA service
    # containers because the latter don't support per-service profiles +
    # custom commands cleanly.
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Tauri system deps (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          version: "1"

      - name: Bring up Kafka cluster zoo (kafka + mb + legacy + sasl + acl)
        run: |
          docker compose --profile kafka --profile mb --profile legacy --profile sasl --profile acl up -d
          docker compose ps

      - name: Wait for every bootstrap port
        # docker compose healthchecks guarantee broker readiness but
        # don't all map to a TCP-ready external listener — wait for
        # each one explicitly so test start is deterministic.
        run: |
          for port in 29092 39092 39093 39094 39096 49092 39097; do
            ok=""
            for _ in $(seq 1 60); do
              if (echo > /dev/tcp/localhost/$port) >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "broker port $port never came up"
              docker compose logs --tail=200
              exit 1
            fi
            echo "$port ready"
          done
        shell: bash

      - name: Run all 25 anti-pattern detector tests against real brokers
        env:
          # `kafka` profile (single-broker, latest)
          KAPTURE_KAFKA_BOOTSTRAP: localhost:29092
          # `mb` profile (3-broker, RF=2-capable)
          KAPTURE_KAFKA_MB_BROKERS: localhost:39092,localhost:39093,localhost:39094
          # `legacy` profile (Apache Kafka 3.7.0)
          KAPTURE_KAFKA_LEGACY: localhost:39096
          # `sasl` profile (SASL_PLAINTEXT, PLAIN)
          KAPTURE_KAFKA_SASL: localhost:49092
          # `acl` profile (SASL_PLAINTEXT + deny-by-default ACLs)
          KAPTURE_KAFKA_ACL: localhost:39097
        # `--test-threads=1` because each test owns its own proxy +
        # correlator and races would mix detections across the shared
        # fold otherwise. Three test crates run in sequence:
        # - anti_patterns_integration  (original 7)
        # - anti_patterns_extended     (next 11)
        # - anti_patterns_more         (latest 7, ACL/UTOP/coordinator…)
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --test anti_patterns_integration \
            --test anti_patterns_extended \
            --test anti_patterns_more \
            --all-features -- --test-threads=1

      - name: Dump broker logs on failure
        if: failure()
        run: docker compose logs --tail=300

  jvm-tap-e2e:
    name: JVM tap end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Runs in its own job because the `ssl` profile's broker binds
    # 39093 — the same port `mb` profile broker-2 uses in the
    # anti-patterns job. Mutually exclusive on port; trivially
    # parallel as separate runners.
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Tauri system deps (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          version: "1"

      - name: Set up JDK 21 (needed for the agent + test client + javaagent flag)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generate self-signed JKS test fixtures
        run: src-tauri/tests/fixtures/certs/gen-certs.sh

      - name: Build the JVM agent
        run: mvn -B -q -DskipTests -f agents/jvm-tap/pom.xml package

      - name: Build the JVM test client
        run: mvn -B -q -DskipTests -f src-tauri/tests/fixtures/jvm-test-client/pom.xml package

      - name: Bring up SSL + plaintext Kafka brokers
        run: |
          docker compose --profile ssl --profile kafka up -d kafka-ssl kafka
          for port in 39093 29092; do
            for _ in $(seq 1 60); do
              if (echo > /dev/tcp/localhost/$port) >/dev/null 2>&1; then
                echo "broker on $port ready"
                break
              fi
              sleep 2
            done
          done

      - name: Run JVM tap end-to-end tests (SSL + plaintext)
        env:
          KAPTURE_JVM_TAP_E2E: "1"
          KAPTURE_KAFKA_SSL_BOOTSTRAP: "localhost:39093"
          KAPTURE_KAFKA_BOOTSTRAP: "localhost:29092"
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --test jvm_tap_e2e \
            --all-features -- --nocapture --test-threads=1

      - name: Dump broker logs on failure
        if: failure()
        run: docker compose --profile ssl --profile kafka logs --tail=300

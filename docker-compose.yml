name: kapture-dev

# Two Kafka stacks side-by-side, on disjoint networks and ports, so
# Kapture can be smoke-tested against both:
#
#   Redpanda — fast single-binary KRaft, our default dev cluster
#     bootstrap : localhost:19092
#     SR        : http://localhost:18081
#
#   Apache Kafka + Confluent Schema Registry — canonical Kafka
#     bootstrap : localhost:29092
#     SR        : http://localhost:28081
#
# Use docker compose profiles to run only one stack:
#   docker compose --profile redpanda up -d
#   docker compose --profile kafka    up -d
# or `docker compose up -d` to bring up both at once.

services:
  # ─────────────────────── Redpanda ───────────────────────
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: kapture-redpanda
    profiles: ["", "redpanda", "all"]
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "19092:19092" # Kafka API
      - "18081:18081" # Schema Registry
      - "9644:9644" # Admin API
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - redpanda

  # ─────────────────── Apache Kafka (KRaft) ───────────────────
  kafka:
    image: apache/kafka:latest
    container_name: kapture-kafka
    profiles: ["", "kafka", "all"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Enable Share Groups (KIP-932 / KIP-994). The share coordinator
      # state topic must be auto-creatable on a single-broker dev
      # cluster — otherwise the share consumer hangs on ApiVersions
      # + DescribeTopicPartitions waiting for `__share_group_state`.
      KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: "classic,consumer,share"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_NUM_PARTITIONS: "1"
      CLUSTER_ID: "kapture-dev-cluster"
    ports:
      - "29092:29092" # Kafka API
    healthcheck:
      test:
        ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - kafka

  kafka-schema-registry:
    image: confluentinc/cp-schema-registry:latest
    container_name: kapture-kafka-sr
    profiles: ["", "kafka", "all"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: kafka-schema-registry
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:9092"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: "_schemas_kapture"
    ports:
      - "28081:8081"
    networks:
      - kafka

  # ──────────── Apache Kafka KRaft 3-broker (multi-broker proxy tests) ────────────
  kafka-mb-1:
    image: apache/kafka:latest
    container_name: kapture-kafka-mb-1
    profiles: ["mb"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:39092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-mb-1:9092,EXTERNAL://localhost:39092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-mb-1:9093,2@kafka-mb-2:9093,3@kafka-mb-3:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "kapture-mb-cluster"
    ports:
      - "39092:39092"
    networks: [kafka-mb]

  kafka-mb-2:
    image: apache/kafka:latest
    container_name: kapture-kafka-mb-2
    profiles: ["mb"]
    environment:
      KAFKA_NODE_ID: "2"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:39093,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-mb-2:9092,EXTERNAL://localhost:39093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-mb-1:9093,2@kafka-mb-2:9093,3@kafka-mb-3:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "kapture-mb-cluster"
    ports:
      - "39093:39093"
    networks: [kafka-mb]

  kafka-mb-3:
    image: apache/kafka:latest
    container_name: kapture-kafka-mb-3
    profiles: ["mb"]
    environment:
      KAFKA_NODE_ID: "3"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:39094,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-mb-3:9092,EXTERNAL://localhost:39094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-mb-1:9093,2@kafka-mb-2:9093,3@kafka-mb-3:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "kapture-mb-cluster"
    ports:
      - "39094:39094"
    networks: [kafka-mb]

  # ──────────────── Apache Kafka with SASL_PLAINTEXT (Phase 3 proxy smoke) ────────────────
  # Single-broker KRaft cluster with a SASL_PLAINTEXT listener on 49092.
  # Mechanism: PLAIN. Dev-only credentials: admin/admin-secret, alice/alice-secret.
  # NEVER reuse these in any non-dev environment.
  kafka-sasl:
    image: apache/kafka:latest
    container_name: kapture-kafka-sasl
    profiles: ["sasl"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,SASL://0.0.0.0:49092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-sasl:9092,SASL://localhost:49092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,SASL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-sasl:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_SASL_ENABLED_MECHANISMS: "PLAIN"
      KAFKA_LISTENER_NAME_SASL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret" user_admin="admin-secret" user_alice="alice-secret";'
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: "PLAIN"
      CLUSTER_ID: "kapture-sasl-cluster"
    ports:
      - "49092:49092"
    networks: [kafka-sasl]

  # ──────────── Apache Kafka with SASL_PLAINTEXT + SCRAM (Phase 4 step 6) ────────────
  # Single-broker KRaft cluster with a SASL_PLAINTEXT listener on 59092.
  # Mechanisms: PLAIN, SCRAM-SHA-256, SCRAM-SHA-512.
  # Inter-broker mechanism is PLAIN (broker bootstraps before SCRAM users exist).
  # Dev-only credentials. NEVER reuse outside the dev stack.
  #   PLAIN          : admin / admin-scram-secret, alice / alice-scram (alias to SCRAM also)
  #   SCRAM-SHA-256  : alice / alice-scram         (provisioned by kafka-scram-init)
  #   SCRAM-SHA-512  : bob   / bob-scram-512       (provisioned by kafka-scram-init)
  kafka-scram:
    image: apache/kafka:latest
    container_name: kapture-kafka-scram
    profiles: ["scram"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,SASL://0.0.0.0:59092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-scram:9092,SASL://localhost:59092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,SASL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-scram:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # PLAIN on the SASL listener provides static creds during the
      # window before SCRAM users are provisioned. SCRAM mechanisms are
      # advertised alongside it.
      KAFKA_SASL_ENABLED_MECHANISMS: "PLAIN,SCRAM-SHA-256,SCRAM-SHA-512"
      # apache/kafka env-to-prop conversion: `_` → `.`, `__` → `_`,
      # `___` → `-`. So `SCRAM___SHA___256` → `scram-sha-256`.
      # All three mechanisms get a per-listener JAAS entry; SCRAM ones
      # use ScramLoginModule which sources creds from broker metadata
      # (provisioned by kafka-scram-init).
      KAFKA_LISTENER_NAME_SASL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-scram-secret" user_admin="admin-scram-secret";'
      KAFKA_LISTENER_NAME_SASL_SCRAM___SHA___256_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required;'
      KAFKA_LISTENER_NAME_SASL_SCRAM___SHA___512_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required;'
      CLUSTER_ID: "kapture-scram-cluster"
    ports:
      - "59092:59092"
    healthcheck:
      test:
        ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-scram:9092 --list || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [kafka-scram]

  # Sidecar that provisions SCRAM users via the internal PLAINTEXT
  # listener once the broker is healthy. Apache Kafka 4.x KRaft
  # requires SCRAM users either at format time (`--add-scram`) or via
  # `kafka-configs.sh --alter` post-startup. We use the latter against
  # the broker's internal PLAINTEXT listener so we avoid the
  # chicken-and-egg of needing SCRAM creds to provision SCRAM users.
  kafka-scram-init:
    image: apache/kafka:latest
    container_name: kapture-kafka-scram-init
    profiles: ["scram"]
    depends_on:
      kafka-scram:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Provisioning SCRAM users via kafka-scram:9092..."
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka-scram:9092 \
          --alter --add-config 'SCRAM-SHA-256=[iterations=4096,password=alice-scram]' \
          --entity-type users --entity-name alice
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka-scram:9092 \
          --alter --add-config 'SCRAM-SHA-512=[iterations=4096,password=bob-scram-512]' \
          --entity-type users --entity-name bob
        echo "SCRAM users provisioned."
    restart: "no"
    networks: [kafka-scram]

  # ──────────── Apache Kafka 3.7.0 — legacy decoder smoke ────────────
  # Pinned to the OLDEST apache/kafka image tag (Apache only started
  # publishing the official Docker image with 3.7). Used to verify
  # the proxy decoder still understands frames from a broker that
  # speaks older Fetch / Metadata / ApiVersions / Coordinator versions.
  # Modern librdkafka clients negotiating against this broker exercise
  # the KIP-511 fallback paths.
  kafka-legacy:
    image: apache/kafka:3.7.0
    container_name: kapture-kafka-legacy
    profiles: ["legacy"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:39096,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-legacy:9092,EXTERNAL://localhost:39096"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-legacy:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "kapture-legacy-cluster"
    ports:
      - "39096:39096"
    networks: [kafka-legacy]

networks:
  redpanda:
    name: kapture-redpanda
  kafka:
    name: kapture-kafka
  kafka-legacy:
    name: kapture-kafka-legacy
  kafka-mb:
    name: kapture-kafka-mb
  kafka-sasl:
    name: kapture-kafka-sasl
  kafka-scram:
    name: kapture-kafka-scram
